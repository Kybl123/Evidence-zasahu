<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#20252b">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
<title>Evidence zásahů</title>
</head>
<body>
<header>
  <div><h1>🚒 Evidence zásahů</h1><small>Online evidence výjezdů</small></div>
  <div class="tools" id="appTools" hidden>
    <span id="userEmail" class="user"></span>
    <button id="addBtn">＋ Přidat zásah</button>
    <button id="statsBtn">📊 Přehled</button>
    <button id="backupBtn">💾 Záloha</button>
    <label class="file">📂 Import<input id="restore" type="file" accept=".json"></label>
    <button id="logoutBtn">Odhlásit</button>
  </div>
</header>

<section id="login" class="login">
  <div class="loginbox">
    <h2>🚒 Evidence zásahů</h2>
    <p>Přihlas se ke své online evidenci.</p>
    <form id="loginForm">
      <label>E-mail<input id="email" type="email" required autocomplete="email"></label>
      <label>Heslo<input id="password" type="password" required autocomplete="current-password"></label>
      <button class="primary" type="submit">Přihlásit</button>
      <button type="button" id="signupBtn">Vytvořit účet</button>
      <div id="loginMsg" class="msg"></div>
    </form>
  </div>
</section>

<main id="app" hidden>
  <div class="layout"><div id="map"></div><aside>
    <div id="side" class="empty"><b>📍</b><h2>Vyber zásah</h2><p>Pro přidání klikni na „Přidat zásah“ a potom na místo v mapě.</p></div>
  </aside></div>
</main>

<dialog id="dlg"><form id="form">
<h2 id="ftitle">Nový zásah</h2><div class="hint" id="placeHint"></div>
<label>Typ zásahu<input id="type" list="types" required placeholder="např. Požár – polní porost"><datalist id="types"></datalist></label>
<div class="cols"><label>Datum<input id="date" type="date" required></label><label>Stupeň poplachu<select id="alarm"><option>I.</option><option>II.</option><option>III.</option><option>IV.</option></select></label></div>
<label>Popis<textarea id="desc" rows="3" placeholder="např. Požár pařezu"></textarea></label>
<fieldset><legend>Výjezd</legend><label class="inline"><input id="jsdh" type="checkbox"> JSDH</label><label class="inline"><input id="hzs" type="checkbox"> HZS</label></fieldset>
<div class="actions"><button type="button" id="cancel">Zrušit</button><button class="primary">Uložit</button></div>
</form></dialog>

<dialog id="statsDlg"><div id="statsBody"></div><div class="actions"><button id="closeStats">Zavřít</button></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body></html>
